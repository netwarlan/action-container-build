name: Build-Publish

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Name of image to build and deploy'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      platforms:
        description: 'Target platforms (e.g., linux/amd64,linux/arm64)'
        required: false
        type: string
        default: 'linux/amd64'
      version:
        description: 'Semantic version tag to apply to the image (e.g., v1.2.3). Empty string means no version tag.'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Newline-separated list of build-time variables (e.g., VERSION=1.0.0)'
        required: false
        type: string
        default: ''
      push:
        description: 'Whether to push the image to the registry'
        required: false
        type: boolean
        default: true
    outputs:
      digest:
        description: 'Image digest'
        value: ${{ jobs.build-and-publish.outputs.digest }}
      image:
        description: 'Full image reference'
        value: ${{ jobs.build-and-publish.outputs.image }}

env:
  REGISTRY: ghcr.io/netwarlan

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ inputs.image-name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=sha,prefix=
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
