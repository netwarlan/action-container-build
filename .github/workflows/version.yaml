name: Version

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: cocogitto/cocogitto-action@v4
        id: cocogitto
        with:
          release: true
          check: true
          check-latest-tag-only: true
      - name: Set version output
        id: version
        run: echo "version=${{ steps.cocogitto.outputs.version }}" >> "$GITHUB_OUTPUT"

  release:
    needs: [version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Push tag, floating tags, and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"

          # Update floating tags (e.g., v1.2.3 -> v1 and v1.2)
          MAJOR=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f2)
          git tag -f "v${MAJOR}"
          git push origin -f "v${MAJOR}"
          git tag -f "v${MAJOR}.${MINOR}"
          git push origin -f "v${MAJOR}.${MINOR}"

          gh release create "$VERSION" --generate-notes
